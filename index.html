<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club House - Associazione Giuseppe Novello</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ch: { primary: '#1b3b5c', secondary: '#2d68c4', accent: '#d4af37', light: '#f8f9fa', dark: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; color: #1e293b; }
        .view { display: none; opacity: 0; transform: translateY(8px); transition: opacity 0.3s ease, transform 0.3s ease; }
        .view.active { display: block; opacity: 1; transform: translateY(0); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(27, 59, 92, 0.1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); }
        .tab-btn.active { border-bottom: 3px solid #1b3b5c; color: #1b3b5c; font-weight: 700; background: rgba(27, 59, 92, 0.05); }
        .hero-gradient { background: linear-gradient(135deg, #1b3b5c 0%, #0f172a 100%); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="flex flex-col min-h-screen selection:bg-ch-primary selection:text-white">

    <header class="bg-white/95 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3.5 cursor-pointer group" onclick="goHome()">
                <div class="hero-gradient p-2.5 rounded-2xl text-white shadow-md group-hover:scale-105 transition duration-300">
                    <i class="fas fa-compass text-xl text-ch-accent"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight text-ch-primary">CLUB HOUSE</h1>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Associazione Giuseppe Novello</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="showView('brochure')" class="text-xs font-semibold text-slate-600 hover:text-ch-primary transition hidden md:flex items-center">
                    <i class="fas fa-book-open mr-1.5 text-ch-primary"></i> La Nostra Brochure & Attività
                </button>
                <div id="header-user-actions">
                    <button onclick="showAuth()" class="text-xs font-bold bg-ch-primary text-white px-5 py-2.5 rounded-xl shadow-sm hover:bg-ch-secondary transition duration-300 flex items-center">
                        <i class="fas fa-user mr-2 text-ch-accent"></i> Area Soci
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full">

        <!-- HOME -->
        <div id="home" class="view active">
            <div class="hero-gradient text-white py-20 px-6 text-center relative overflow-hidden shadow-xl">
                <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#d4af37_1px,transparent_1px)] [background-size:16px_16px]"></div>
                <div class="relative max-w-3xl mx-auto">
                    <span class="inline-block uppercase tracking-widest text-[11px] font-extrabold text-ch-accent bg-ch-accent/10 px-3.5 py-1.5 rounded-full mb-4 border border-ch-accent/30">Esplora • Condividi • Vivi</span>
                    <h2 class="text-3xl md:text-5xl font-extrabold mb-4 tracking-tight">Viaggi, cultura e nuove amicizie</h2>
                    <p class="text-base md:text-lg text-slate-300 font-light italic mb-6">"Esperienze che arricchiscono la vita, a ogni età. Più di un'associazione... una grande famiglia!"</p>
                    <div class="flex flex-wrap justify-center gap-3">
                        <button onclick="showView('brochure')" class="bg-ch-accent text-ch-dark px-6 py-3 rounded-xl text-xs font-extrabold shadow hover:bg-amber-400 transition">Scopri le Attività</button>
                        <button onclick="showAuth()" class="bg-white/10 border border-white/30 text-white px-6 py-3 rounded-xl text-xs font-bold hover:bg-white/20 transition">Diventa Socio</button>
                    </div>
                </div>
            </div>
            <div class="max-w-7xl mx-auto px-6 py-12">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div>
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-xl font-extrabold text-slate-900 flex items-center"><span class="w-2.5 h-6 bg-ch-primary rounded-full mr-2.5"></span> Viaggi Programmati</h3>
                        </div>
                        <div id="dynamic-trips-list" class="space-y-4"></div>
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-xl font-extrabold text-slate-900 flex items-center"><span class="w-2.5 h-6 bg-amber-600 rounded-full mr-2.5"></span> Eventi & Incontri</h3>
